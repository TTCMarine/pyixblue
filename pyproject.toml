[project]
name = "pyixblue"
dynamic = ["version"]
description = "Python parser for the iXblue stdbin protocol"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []
keywords = ["ixblue", "stdbin", "inertial", "navigation", "parser"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/TTCMarine/pyixblue"
Repository = "https://github.com/TTCMarine/pyixblue"
Issues = "https://github.com/TTCMarine/pyixblue/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pyixblue/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
